<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACM CHI 2060 - Continuous Stream Dump</title>
  
  <!-- Google Fonts & Ion Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <style>
    /* ==========================================
       STREAM DUMP THEME SPECIFIC STYLES
       ========================================== */
    :root {
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-mono: 'Fira Code', monospace;
      
      --bg-body: #ffffff;
      --bg-light: #ffffff;
      --bg-card: #ffffff;
      
      --color-border: #111111;
      --color-border-dark: #111111;
      
      --text-main: #000000;
      --text-secondary: #000000;
      --text-muted: #555555;
      --color-link: #000000;
      --color-link-hover: #555555;
      
      --radius-custom: 12px;
      --box-shadow-custom: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      
      --btn-bg: #ffffff;
      --btn-text: #334155;
      --btn-border: #cbd5e1;
      --btn-primary-bg: #0f172a;
      --btn-primary-text: #ffffff;
      
      --transition-smooth: all 0.2s ease-in-out;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: var(--color-link);
      text-decoration: underline;
      transition: var(--transition-smooth);
    }
    a:hover {
      color: var(--color-link-hover);
    }

    .app-container {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Header Banner */
    .visual-header-banner {
      width: 100%;
      height: 160px;
      position: relative;
      background: #ffffff; border-bottom: 1px solid var(--color-border);
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1.5rem calc((100vw - 1000px) / 2 + 1.5rem);
      color: var(--text-main);
    }
    @media (max-width: 1040px) {
      .visual-header-banner {
        padding: 1.5rem 2rem;
      }
      .banner-subtitle {
        white-space: normal;
      }
    }
    .banner-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 0.2rem;
    }
    .banner-subtitle {
      font-size: 1rem;
      font-weight: 400;
      color: #94a3b8;
      white-space: nowrap;
    }
    .banner-meta {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 0.2rem;
    }

    /* Navigation / Toolbar Bar */
    .nav-bar {
      background: #ffffff;
      padding: 0 calc((100vw - 1000px) / 2 + 1.5rem);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 50px;
    }
    @media (max-width: 1040px) {
      .nav-bar {
        padding: 0 2rem;
      }
    }
    .toolbar-info {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Controls Panel */
    .controls-panel {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .cycle-btn {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--btn-text);
      font-size: 0.75rem;
      font-family: var(--font-mono);
      font-weight: 600;
      cursor: pointer;
      padding: 0.35rem 0.75rem;
      transition: var(--transition-smooth);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .cycle-btn:hover {
      border-color: var(--color-border-dark);
      background: var(--bg-light);
    }

    /* Main Content Area */
    .stream-layout {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 0.5rem 1.5rem 6rem;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }
    @media (max-width: 1040px) {
      .stream-layout {
        padding: 0.5rem 2rem 6rem;
      }
    }

    /* Source Path Header Chip */
    .source-path-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--bg-light);
      padding: 0.25rem 0.6rem;
      margin-bottom: 0.5rem;
      border: 1px solid var(--color-border);
    }

    /* Block Card Wrapper */
    .block-card-wrapper {
      display: flex;
      flex-direction: column;
    }

    /* Content Blocks */
    .content-block {
      border: 1px solid var(--color-border);
      padding: 1.5rem;
      background: var(--bg-card);
    }
    .block-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.75rem;
    }
    .block-description {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }
    .content-block p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }
    .content-block p:last-child {
      margin-bottom: 0;
    }
    
    .bullet-list { list-style-position: inside; margin-bottom: 1rem; font-size: 0.9rem; }
    .bullet-list li { margin-bottom: 0.4rem; color: var(--text-secondary); }

    .dense-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      margin-bottom: 1rem;
    }
    .dense-table th, .dense-table td {
      border: 1px solid var(--color-border);
      padding: 0.5rem 0.75rem;
    }
    .dense-table th { background: var(--bg-light); color: var(--text-main); font-weight: 700; text-align: left; }

    /* Subcommittee lists */
    .subcommittee-item { margin-bottom: 0.75rem; }
    .subcommittee-title { font-weight: 700; font-size: 0.9rem; color: var(--text-main); }
    .subcommittee-desc { color: var(--text-muted); font-size: 0.8rem; margin-top: 0.1rem; }

    /* Forms */
    .form-panel {
      border: 1px solid var(--color-border);
      background: #ffffff;
      padding: 1.25rem;
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .form-group { margin-bottom: 0.75rem; }
    .form-label { display: block; font-size: 0.7rem; font-weight: 700; margin-bottom: 0.2rem; text-transform: uppercase; color: var(--text-secondary); }
    .form-input {
      width: 100%;
      background: var(--bg-body);
      border: 1px solid var(--color-border);
      padding: 0.5rem 0.75rem;
      color: var(--text-main);
      font-size: 0.8rem;
      transition: var(--transition-smooth);
    }
    .form-input:focus {
      outline: none;
      border-color: var(--color-border-dark);
    }
    .form-checkbox-label { display: flex; gap: 0.5rem; font-size: 0.75rem; cursor: pointer; color: var(--text-secondary); }
    .form-checkbox-label input { margin-top: 0.15rem; }
    
    .canvas-wrapper {
      border: 1px solid var(--color-border);
      background: #ffffff;
      position: relative;
      height: 120px;
      overflow: hidden;
    }
    #signature-canvas { position: absolute; top:0; left:0; width:100%; height:100%; }
    .canvas-tip {
      position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: var(--text-muted); font-size: 0.7rem; font-family: var(--font-mono); pointer-events: none;
    }
    .canvas-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.25rem; }

    .btn {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--btn-text);
      padding: 0.4rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-smooth);
    }
    .btn:hover { background: var(--bg-light); }
    .btn-primary { background: var(--btn-primary-bg); border: none; color: var(--btn-primary-text); }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { background: var(--bg-light); color: var(--text-muted); cursor: not-allowed; }

    .terminal-panel {
      background: #0f172a;
      border: 1px solid var(--color-border-dark);
      padding: 1rem;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      margin-top: 1rem;
    }
    .terminal-hdr { display: flex; justify-content: space-between; border-bottom: 1px solid #334155; padding-bottom: 0.25rem; color: #38bdf8; }
    .terminal-body { max-height: 80px; overflow-y: auto; color: #cbd5e1; display: flex; flex-direction: column; gap: 0.15rem; }
    .terminal-line .ts { color: #84cc16; }
    .terminal-line .ok { font-weight: bold; color: #10b981; }
    .terminal-line .warn { color: #fb923c; }

    /* Disputes list */
    .board-card { border: 1px solid var(--color-border); margin-bottom: 0.5rem; overflow: hidden; }
    .board-head { background: #ffffff; padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .board-head:hover { background: var(--bg-light); }
    .board-head-left { display: flex; align-items: center; gap: 0.5rem; min-width: 0; flex: 1; margin-right: 1.5rem; }
    .badge-tag { font-size: 0.6rem; font-family: var(--font-mono); padding: 0.1rem 0.4rem; font-weight: 700; border: 1px solid var(--color-border-dark); white-space: nowrap; flex-shrink: 0; }
    .badge-tag.red { background: #fef2f2; color: #ef4444; border-color: #fca5a5; }
    .badge-tag.orange { background: #fffbeb; color: #d97706; border-color: #fde68a; }
    .board-card-title { font-weight: 700; font-size: 0.85rem; color: var(--text-main); }
    .board-head-right { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; white-space: nowrap; }
    .board-body { padding: 1rem; background: #ffffff; border-top: 1px solid var(--color-border); display: none; }
    .board-body.open { display: block; }
    .board-question-text { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.75rem; white-space: pre-line; }
    .board-post-title { font-size: 1.1rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.75rem; line-height: 1.3; }
    .sponsor-tiers { display: flex; flex-direction: column; gap: 2.5rem; }
    .sponsor-tier-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); border-bottom: 1px solid var(--color-border); padding-bottom: 0.4rem; margin-bottom: 1.25rem; }
    .sponsor-logo-grid { display: flex; flex-wrap: wrap; align-items: center; gap: 1.5rem 2rem; }
    .sponsor-tier-hero .sponsor-logo-img { max-height: 64px; }
    .sponsor-tier-champion .sponsor-logo-img { max-height: 40px; }
    .sponsor-tier-contributing .sponsor-logo-img { max-height: 32px; }
    .sponsor-logo-item { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
    .sponsor-logo-img { max-width: 160px; object-fit: contain; transition: opacity 0.2s; }
    .sponsor-logo-img:hover { opacity: 0.75; }
    .sponsor-logo-link { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; text-decoration: none; }
    .board-reply { background: var(--bg-light); border-left: 3px solid var(--color-link); padding: 0.75rem; }
    .board-reply-hdr { font-size: 0.7rem; font-weight: 700; margin-bottom: 0.2rem; display: flex; align-items: center; gap: 0.3rem; color: var(--text-main); }
    .board-reply-text { font-size: 0.8rem; color: var(--text-secondary); }

    /* Papers Catalog Styles */
    .catalog-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      border: 1px solid var(--color-border);
      padding: 0.75rem;
      background: var(--bg-light);
    }
    .filter-input {
      flex: 2;
      min-width: 200px;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--color-border);
      background: #ffffff;
      color: var(--text-main);
      font-size: 0.8rem;
      outline: none;
    }
    .filter-select {
      flex: 1;
      padding: 0.4rem;
      border: 1px solid var(--color-border);
      background: #ffffff;
      color: var(--text-main);
      font-size: 0.8rem;
      outline: none;
      cursor: pointer;
    }
    .catalog-tabs {
      display: flex;
      background: var(--bg-light);
      padding: 0.2rem;
      margin-bottom: 1rem;
      gap: 0.2rem;
    }
    .catalog-tab {
      flex: 1;
      padding: 0.45rem;
      background: transparent;
      color: var(--text-secondary);
      border: none;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .catalog-tab.active {
      background: #ffffff;
      color: var(--text-main);
    }
    .paper-card {
      border: 1px solid var(--color-border);
      padding: 1.25rem;
      margin-bottom: 1rem;
      background: #ffffff;
    }
    .paper-card-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      border-bottom: 1px dashed var(--color-border);
      padding-bottom: 0.35rem;
    }
    .paper-card-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.4rem;
      line-height: 1.3;
    }
    .paper-card-authors {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }
    .paper-card-ftr {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      margin-top: 0.5rem;
      border-top: 1px dashed var(--color-border);
      padding-top: 0.35rem;
    }
    .award-badge {
      font-weight: 700;
      background: #eab308;
      color: var(--text-main);
      padding: 0.1rem 0.35rem;
      font-size: 0.6rem;
      margin-left: 0.5rem;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .academic-footer {
      border-top: 1px solid var(--color-border);
      background: #ffffff;
      padding: 2.5rem 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="app-container" id="app">
    
    <!-- Header Banner -->
    <div class="visual-header-banner">
      <h2 class="banner-title" id="spec-banner-title"></h2>
      <div class="banner-subtitle" id="spec-banner-subtitle"></div>
      <div class="banner-meta" id="spec-banner-meta"></div>
    </div>

    <!-- Navigation Menu Bar -->
    <nav class="nav-bar">
      


    </nav>

    <!-- Main Scrollable Column -->
    <main class="stream-layout" id="stream-blocks-container">
      <!-- Programmatic blocks rendered here -->
    </main>

    <!-- Academic Footer -->
    <footer class="academic-footer">
      <div>© 2060 • ACM SIGCHI</div>
    </footer>

  </div>

  <!-- Load Shared Locale Specifications -->
  <script src="chi2060_papers.js"></script>
  <script src="specifications.js"></script>

  <!-- Binding & Script logic -->
  <script>
    let paperQuery = "";
    let paperSubcommittee = "";
    let paperTrack = "all";

    function bindAcademicData() {
      document.getElementById("spec-banner-title").textContent = CHI2060_SPEC.conference.name;
      document.getElementById("spec-banner-subtitle").textContent = CHI2060_SPEC.conference.theme + (CHI2060_SPEC.conference.location ? ' • ' + CHI2060_SPEC.conference.location : '') + ' • ' + CHI2060_SPEC.conference.dates;
      document.getElementById("spec-banner-meta").style.display = "none";
    }

    function renderFeed() {
      const container = document.getElementById("stream-blocks-container");
      if (!container) return;

      let html = "";
      
      // Flatten all hierarchical data stream
      Object.keys(CHI2060_SPEC.navigation).forEach(tabId => {
        const tab = CHI2060_SPEC.navigation[tabId];
        Object.keys(tab.subtabs).forEach(subtabId => {
          const subtab = tab.subtabs[subtabId];
          subtab.contentBlocks.forEach((block, bIdx) => {
            html += `
              <div class="block-card-wrapper">
                <div class="source-path-chip">
                  <ion-icon name="git-network-outline"></ion-icon>
                  <span>[${tab.label} » ${subtab.label}]</span>
                </div>
                <div class="content-block ${block.type}-block">
            `;
            
            if (block.title) {
              if (block.title === "Full Program") {
                html += `<h3 class="block-title" style="cursor:pointer; display:flex; justify-content:space-between; align-items:center;" onclick="const content = this.nextElementSibling; const icon = this.querySelector('ion-icon'); if(content.style.display==='none'){content.style.display='block'; icon.name='chevron-up-outline';}else{content.style.display='none'; icon.name='chevron-down-outline';}">${block.title} <ion-icon name="chevron-up-outline"></ion-icon></h3><div class="full-program-collapsible">`;
              } else {
                html += `<h3 class="block-title">${block.title}</h3>`;
              }
            }
            if (block.description) {
              html += `<p class="block-description">${block.description}</p>`;
            }
            
            if (block.type === "text_block") {
              block.paragraphs.forEach(p => {
                html += `<p>${p}</p>`;
              });
            } else if (block.type === "subcommittee_list") {
              html += `<div class="subcommittees-list">`;
              block.items.forEach(sub => {
                html += `
                  <div class="subcommittee-item">
                    <div class="subcommittee-title">${sub.title}</div>
                    <div class="subcommittee-desc">${sub.desc}</div>
                  </div>
                `;
              });
              html += `</div>`;
            } else if (block.type === "bullet_list") {
              html += `<ul class="bullet-list">`;
              block.items.forEach(item => {
                html += `<li>${item}</li>`;
              });
              html += `</ul>`;
            } else if (block.type === "table_block") {
              html += `
                <table class="dense-table">
                  <thead>
                    <tr>
                      ${block.headers.map(h => `<th>${h}</th>`).join("")}
                    </tr>
                  </thead>
                  <tbody>
                    ${block.rows.map(row => `
                      <tr>
                        ${row.map((cell, idx) => {
                          if (typeof cell === 'object' && cell !== null) {
                            if (cell.skip) return '';
                            let attrs = '';
                            if (cell.rowspan) attrs += ` rowspan="${cell.rowspan}"`;
                            if (cell.colspan) attrs += ` colspan="${cell.colspan}"`;
                            let content = cell.text || '';
                            if (idx === 0) content = `<strong>${content}</strong>`;
                            return `<td${attrs}>${content}</td>`;
                          }
                          return idx === 0 ? `<td><strong>${cell}</strong></td>` : `<td>${cell}</td>`;
                        }).join("")}
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              `;
            } else if (block.type === "submission_form") {
              const f = block.form;
              html += `
                <div class="form-panel">
                  <form id="seed-registry-form" onsubmit="submitAgentRegistry(event)">
                    <div class="form-grid">
                      <div class="form-group">
                        <label class="form-label" id="lbl-reg-name">name of human researcher</label>
                        <input type="text" id="reg-name" class="form-input" placeholder="e.g. Dr. Ha-Jun Kim" required oninput="checkFormStatus()">
                      </div>
                      <div class="form-group">
                        <label class="form-label">nationality of human researcher</label>
                        <input type="text" id="reg-nationality" class="form-input" placeholder="e.g. South Korea" required>
                      </div>
                      <div class="form-group">
                        <label class="form-label">Wickathon registration</label>
                        <select id="reg-interest" class="form-input">
                        <option value="climate">Climate Change</option>
                        <option value="mental_health">Mental Health</option>
                        <option value="inequality">Inequality</option>
                      </select>
                      </div>
                      <div class="form-group">
                        <label class="form-label">Agent Model Attachment (.soma, .safetensors)</label>
                        <input type="file" id="reg-file" class="form-input" accept=".soma,.safetensors,.json,.zip" required>
                      </div>
                    </div>
                    
                    <div class="form-group">
                      <label class="form-label" id="lbl-reg-sig">${f.signatureLabel}</label>
                      <div class="canvas-wrapper">
                        <div class="canvas-tip" id="sig-tip">${f.signatureTip}</div>
                        <canvas id="signature-canvas"></canvas>
                      </div>
                      <div class="canvas-actions">
                        <button type="button" class="btn" onclick="clearSignature()">Clear</button>
                      </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="btn-submit-seed" style="width:100%; display:flex; justify-content:center; align-items:center; gap:0.5rem;" disabled>
                      <ion-icon name="cloud-upload-outline"></ion-icon> <span id="lbl-reg-submit">${f.submitText}</span>
                    </button>
                  </form>
                  <div class="terminal-panel" id="console-simulation" style="display:none;">
                    <div class="terminal-hdr">
                      <span>GRID SEED TELEMETRY</span>
                      <span id="telemetry-status-badge" style="font-weight:bold;">SYNCHRONIZING</span>
                    </div>
                    <div class="terminal-body" id="console-logs-holder"></div>
                  </div>
                </div>
              `;
            } else if (block.type === "disputes_board") {
              html += `<div class="board-list">`;
              CHI2060_SPEC.disputes.forEach(d => {
                html += `
                  <div class="board-card">
                    <div class="board-head" onclick="openDispute('${d.id}')">
                      <div class="board-head-left">
                        <span class="board-card-title">${d.title}</span>
                      </div>
                      <div class="board-head-right">
                        <span>${d.author}</span>
                        <span>${d.date}</span>
                        <ion-icon name="chevron-down-outline" id="${d.id}-icon"></ion-icon>
                      </div>
                    </div>
                    <div class="board-body" id="${d.id}">
                      <p class="board-post-title">${d.title}</p>
                      <p class="board-question-text">${d.question}</p>
                      <div class="board-reply">
                        <div class="board-reply-hdr">
                          <ion-icon name="shield-checkmark-outline"></ion-icon>
                          ${d.replyHeader}
                        </div>
                        <p class="board-reply-text">${d.replyText}</p>
                      </div>
                    </div>
                  </div>
                `;
              });
              html += `</div>`;
            } else if (block.type === "papers_catalog") {
              html += `
                <div class="catalog-tabs">
                  <button class="catalog-tab ${paperTrack === 'all' ? 'active' : ''}" onclick="setPaperTrack('all')">All Papers</button>
                  <button class="catalog-tab ${paperTrack === 'conference' ? 'active' : ''}" onclick="setPaperTrack('conference')">Conference Track</button>
                  <button class="catalog-tab ${paperTrack === 'journal' ? 'active' : ''}" onclick="setPaperTrack('journal')">Journal Track</button>
                </div>
                <div class="catalog-filters">
                  <input type="text" id="paper-search" class="filter-input" placeholder="Search title, authors, ID..." value="${paperQuery}" oninput="setPaperQuery(this.value)">
                  <select class="filter-select" onchange="setPaperSubcommittee(this.value)">
                    <option value="">All Subcommittees</option>
                    ${getUniqueSubcommittees().map(sub => `
                      <option value="${sub}" ${paperSubcommittee === sub ? 'selected' : ''}>${sub}</option>
                    `).join("")}
                  </select>
                </div>
                <div class="papers-list-feed">
                  ${renderFilteredPapersList()}
                </div>
              `;
            } else if (block.type === "collapsible_papers_list") {
              let bodyBg = "#fff";
              let headerBg = "#eee";
              let borderCol = "#111";
              let fontFam = "var(--font-mono, monospace)";
              let fontCol = "#000";
              let subCol = "#555";
              
              if (location.href.includes("index_ide")) {
                bodyBg = "#1e1e1e";
                headerBg = "#252526";
                borderCol = "#3c3c3c";
                fontCol = "#cccccc";
                subCol = "#858585";
              } else if (location.href.includes("index_dandy")) {
                bodyBg = "#fcfaf2";
                headerBg = "#e6dfcc";
                borderCol = "#222";
                fontFam = "var(--font-serif, Georgia, serif)";
                fontCol = "#222";
                subCol = "#555";
              } else if (location.href.includes("index_dump")) {
                bodyBg = "#fff";
                headerBg = "#f5f5f5";
                borderCol = "#ccc";
                fontCol = "#333";
                subCol = "#666";
              }

              html += `
                <div class="collapsible-papers-container" style="border:1px solid ${borderCol}; margin-top:1.5rem; margin-bottom:1.5rem;">
                  <div class="collapsible-papers-header" onclick="toggleCollapsiblePapers(this)" style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem 1rem; cursor:pointer; background:${headerBg}; font-weight:700; font-family:${fontFam}; font-size:0.85rem; border-bottom:1px solid ${borderCol}; color:${fontCol};">
                    <span>${block.title || 'ACCEPTED PAPERS CORPUS'}</span>
                    <div style="display:flex; align-items:center; gap:0.5rem;">
                      <span class="collapsible-status" style="font-size:0.75rem; font-weight:normal; color:${subCol}; font-style:italic;">(CLICK TO EXPAND)</span>
                      <ion-icon name="chevron-down-outline" class="arrow-icon" style="transition: transform 0.2s ease; font-size:0.9rem; color:${fontCol};"></ion-icon>
                    </div>
                  </div>
                  <div class="collapsible-papers-body" style="display:none; max-height:450px; overflow-y:auto; padding:1rem; background:${bodyBg};">
                    <div class="loading-indicator" style="font-family:var(--font-mono); font-size:0.8rem; padding:1rem; text-align:center; color:${fontCol};">Loading papers database from JSON...</div>
                  </div>
                </div>
              `;
            } else if (block.type === "sponsor_block") {
              html += `<div class="sponsor-tiers">`;
              block.tiers.forEach(tier => {
                html += `
                  <div class="sponsor-tier">
                    <div class="sponsor-tier-label">${tier.label}</div>
                    <div class="sponsor-logo-grid sponsor-tier-${tier.label.toLowerCase()}">
                      ${tier.sponsors.map(s => `
                        <div class="sponsor-logo-item">
                          <a href="${s.url}" target="_blank" rel="noopener" class="sponsor-logo-link">
                            <img src="${s.logo}" alt="${s.name}" title="${s.name}" class="sponsor-logo-img">
                          </a>
                        </div>
                      `).join("")}
                    </div>
                  </div>
                `;
              });
              html += `</div>`;
            }            if (block.title === "Full Program") {
              html += `</div>`;
            }


            html += `
                </div>
              </div>
            `;
          });
        });
      });

      container.innerHTML = html;
      
      // Initialize drawing signature canvas if available
      setTimeout(initSignatureCanvas, 100);
    }

    function toggleCollapsiblePapers(header) {
      const container = header.parentElement;
      const body = container.querySelector(".collapsible-papers-body");
      const arrow = header.querySelector(".arrow-icon");
      const statusText = header.querySelector(".collapsible-status");
      
      const isOpen = body.classList.toggle("open");
      body.style.display = isOpen ? "block" : "none";
      arrow.style.transform = isOpen ? "rotate(180deg)" : "";
      statusText.textContent = isOpen ? "(CLICK TO COLLAPSE)" : "(CLICK TO EXPAND)";
      
      if (isOpen && !body.dataset.loaded) {
        body.dataset.loaded = "true";
        if (CHI2060_PAPERS) {
          renderFromData(CHI2060_PAPERS);
        } else {
          body.innerHTML = `<p style="color:red; font-family:var(--font-mono); font-size:0.8rem; text-align:center;">Failed to load papers database.</p>`;
        }
      }

      function renderFromData(data) {
        let list = [];
        if (data.conference_papers) {
          list = list.concat(data.conference_papers.map(p => ({ ...p, track: "Conference" })));
        }
        if (data.journal_papers) {
          list = list.concat(data.journal_papers.map(p => ({ ...p, track: "Journal" })));
        }
        
        let borderCol = "#111";
        if (location.href.includes("index_ide")) borderCol = "#3c3c3c";
        else if (location.href.includes("index_dandy")) borderCol = "#222";

        const listHtml = list.map(p => {
          const badge = p.award ? `<span class="award-badge"><ion-icon name="trophy-outline" style="vertical-align:middle; margin-right:2px;"></ion-icon>${p.award}</span>` : '';
          const auths = p.authors.map(a => `${a.human} (<span style="color:var(--color-link);">${a.agent}</span>) [${a.contribution_pct}%]`).join(", ");
          return `
            <div class="paper-card" style="margin-bottom:0.75rem;">
              <div class="paper-card-hdr">
                <span>${p.id} // TRACK: ${p.track.toUpperCase()}</span>
                <div>
                  <span style="font-weight:700; border:1px solid ${borderCol}; padding:0.1rem 0.3rem;">${p.subcommittee}</span>
                  ${badge}
                </div>
              </div>
              <h4 class="paper-card-title">${p.title}</h4>
              <div class="paper-card-authors"><strong>Seeders:</strong> ${auths}</div>
              <div class="paper-card-ftr">
                <span>FILE: <a href="#download" onclick="alert('Downloading: ${p.file}'); event.stopPropagation();">${p.file}</a> (${p.file_size_mb} MB)</span>
                <span>COMPATIBILITY: ${p.compatible_agent_version} (${p.compatible_os.join(", ")})</span>
              </div>
            </div>
          `;
        }).join("");
        
        body.innerHTML = listHtml;
      }
    }

    function openDispute(disputeId) {
      const body = document.getElementById(disputeId);
      const icon = document.getElementById(`${disputeId}-icon`);
      const allBodies = document.querySelectorAll(".board-body");
      const allIcons = document.querySelectorAll(".board-head ion-icon");

      allBodies.forEach(bd => {
        if(bd.id !== disputeId) bd.classList.remove("open");
      });
      allIcons.forEach(ic => {
        if(ic.id !== `${disputeId}-icon`) ic.setAttribute("name", "chevron-down-outline");
      });

      const isOpen = body.classList.toggle("open");
      if (isOpen) {
        icon.setAttribute("name", "chevron-up-outline");
      } else {
        icon.setAttribute("name", "chevron-down-outline");
      }
    }

    function getUniqueSubcommittees() {
      const subs = new Set();
      if (CHI2060_PAPERS && CHI2060_PAPERS.conference_papers && CHI2060_PAPERS.journal_papers) {
        CHI2060_PAPERS.conference_papers.forEach(p => subs.add(p.subcommittee));
        CHI2060_PAPERS.journal_papers.forEach(p => subs.add(p.subcommittee));
      }
      return Array.from(subs).sort();
    }

    function setPaperTrack(track) {
      paperTrack = track;
      renderFeed();
    }

    function setPaperQuery(query) {
      paperQuery = query;
      const feed = document.querySelector(".papers-list-feed");
      if (feed) {
        feed.innerHTML = renderFilteredPapersList();
      }
    }

    function setPaperSubcommittee(sub) {
      paperSubcommittee = sub;
      renderFeed();
    }

    function renderFilteredPapersList() {
      if (!CHI2060_PAPERS || !CHI2060_PAPERS.conference_papers || !CHI2060_PAPERS.journal_papers) return '';
      let list = [];
      if (paperTrack === "all" || paperTrack === "conference") {
        list = list.concat(CHI2060_PAPERS.conference_papers.map(p => ({ ...p, track: "Conference" })));
      }
      if (paperTrack === "all" || paperTrack === "journal") {
        list = list.concat(CHI2060_PAPERS.journal_papers.map(p => ({ ...p, track: "Journal" })));
      }
      
      // Query filter
      if (paperQuery) {
        const q = paperQuery.toLowerCase();
        list = list.filter(p => 
          p.title.toLowerCase().includes(q) || 
          p.id.toLowerCase().includes(q) || 
          p.authors.some(a => a.human.toLowerCase().includes(q) || a.agent.toLowerCase().includes(q))
        );
      }
      
      // Subcommittee filter
      if (paperSubcommittee) {
        list = list.filter(p => p.subcommittee === paperSubcommittee);
      }
      
      if (list.length === 0) {
        return `<p style="padding: 1.5rem; text-align: center; color: var(--text-muted); font-family: var(--font-mono); font-size: 0.8rem;">No publications found matching criteria.</p>`;
      }
      
      return list.map(p => {
        const awardHtml = p.award ? `<span class="award-badge"><ion-icon name="trophy-outline" style="font-size:0.75rem; vertical-align:middle; margin-right:2px;"></ion-icon>${p.award}</span>` : "";
        const authorsHtml = p.authors.map(a => `${a.human} (<span style="color:var(--color-link);">${a.agent}</span>) [${a.contribution_pct}%]`).join(", ");
        
        return `
          <div class="paper-card">
            <div class="paper-card-hdr">
              <span>${p.id} // TRACK: ${p.track.toUpperCase()}</span>
              <div>
                <span style="font-weight:700; background:var(--bg-light); color:var(--text-secondary); border: 1px solid var(--color-border); padding: 0.15rem 0.4rem;">${p.subcommittee}</span>
                ${awardHtml}
              </div>
            </div>
            <h4 class="paper-card-title">${p.title}</h4>
            <div class="paper-card-authors">
              <strong>Seeders:</strong> ${authorsHtml}
            </div>
            <div class="paper-card-ftr">
              <span>FILE: <a href="#download" onclick="alert('Downloading Somatic Package: ${p.file}')">${p.file}</a> (${p.file_size_mb} MB)</span>
              <span>COMPATIBILITY: ${p.compatible_agent_version} (${p.compatible_os.join(", ")})</span>
            </div>
          </div>
        `;
      }).join("");
    }

    /* ==========================================
       CANVAS SIGNATURE DRAWING SYSTEM
       ========================================= */
    let canvas = null;
    let ctx = null;
    let isDrawing = false;
    let signaturePresent = false;

    function resizeCanvas() {
      if (!canvas || !ctx) return;
      const container = canvas.parentNode;
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
    }

    function startDraw(e) {
      if (!ctx) return;
      isDrawing = true;
      document.getElementById("sig-tip").style.display = "none";
      ctx.beginPath();
      const pos = getPos(e);
      ctx.moveTo(pos.x, pos.y);
      checkFormStatus();
    }
    function drawLine(e) {
      if (!isDrawing || !ctx) return;
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }
    function endDraw() {
      isDrawing = false;
      signaturePresent = true;
      checkFormStatus();
    }
    function getPos(e) {
      if (!canvas) return { x: 0, y: 0 };
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function initSignatureCanvas() {
      canvas = document.getElementById("signature-canvas");
      if (!canvas) return;
      ctx = canvas.getContext("2d");
      
      canvas.addEventListener("mousedown", startDraw);
      canvas.addEventListener("mousemove", drawLine);
      canvas.addEventListener("mouseup", endDraw);
      canvas.addEventListener("mouseleave", endDraw);
      canvas.addEventListener("touchstart", (e) => { e.preventDefault(); startDraw(e); });
      canvas.addEventListener("touchmove", (e) => { e.preventDefault(); drawLine(e); });
      canvas.addEventListener("touchend", endDraw);
      
      resizeCanvas();
      updateCanvasBrushStyle();
    }

    function updateCanvasBrushStyle() {
      if (!ctx) return;
      ctx.strokeStyle = "#2563eb";
    }

    function clearSignature() {
      if (!ctx || !canvas) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      document.getElementById("sig-tip").style.display = "block";
      signaturePresent = false;
      checkFormStatus();
    }

    /* ==========================================
       FORM SYSTEM
       ========================================== */
    function checkFormStatus() {
      const nameVal = document.getElementById("reg-name").value;
      const checkVal = document.getElementById("reg-check").checked;
      const submitBtn = document.getElementById("btn-submit-seed");
      if (submitBtn) {
        submitBtn.disabled = !(nameVal.trim() !== "" && checkVal && signaturePresent);
      }
    }

    function submitAgentRegistry(e) {
      e.preventDefault();
      const seederName = document.getElementById("reg-name").value;
      const seederCore = document.getElementById("reg-core").value;
      const consolePanel = document.getElementById("console-simulation");
      const logsHolder = document.getElementById("console-logs-holder");
      const submitBtn = document.getElementById("btn-submit-seed");

      submitBtn.disabled = true;
      consolePanel.style.display = "block";
      logsHolder.innerHTML = "";

      const sequence = [
        { type: "info", text: "Connecting to Somatic Sync Port..." },
        { type: "info", text: `Authenticating owner: "${seederName}"` },
        { type: "ok", text: "FOOTPRINT AUTHENTICATED: HOTS-OK-2060" },
        { type: "info", text: `Provisioning container for core: "${seederCore}"` },
        { type: "warn", text: "Latency jitter balanced (0.12ms)." },
        { type: "ok", text: "AGENT SEED ONLINE. Synchronized successfully." }
      ];

      let elapsed = 0;
      sequence.forEach((log, idx) => {
        setTimeout(() => {
          const nowStr = new Date().toISOString().split('T')[1].slice(0, 8);
          const logRow = document.createElement("div");
          logRow.className = "terminal-line";
          let colorClass = log.type === "ok" ? "class='ok'" : log.type === "warn" ? "class='warn'" : "";
          logRow.innerHTML = `<span class="ts">[${nowStr}]</span> <span ${colorClass}>${log.text}</span>`;
          logsHolder.appendChild(logRow);
          logsHolder.scrollTop = logsHolder.scrollHeight;

          if (idx === sequence.length - 1) {
            submitBtn.innerHTML = "<ion-icon name='checkmark-done-outline'></ion-icon> Seed Active";
            submitBtn.style.background = "#10b981";
            submitBtn.style.color = "#ffffff";
            registerVirtualTransactionLocal(seederName, seederCore);
          }
        }, elapsed);
        elapsed += 200 + Math.random() * 300;
      });
    }

    function registerVirtualTransactionLocal(name, core) {
      const dynamicTransaction = {
        "id": "AUDIT-" + Math.floor(Math.random()*90000 + 10000),
        "type": "REGISTRATION_AUDIT",
        "badge": "AUDIT",
        "badgeClass": "orange",
        "title": `Seeder registration profile for ${name}`,
        "author": `${core}-Proxy-Agent`,
        "date": new Date().toISOString().split('T')[0],
        "question": `Owner Signature verified. Seeding parameters locked to: ${core}. Platform context threshold aligned to 60%.`,
        "replyHeader": "Harvey Legal-AI v9.12",
        "replyText": "System configuration verified. Virtual agent initialized and mapped to the Somatic Virtual Network grid."
      };
      
      CHI2060_SPEC.disputes.unshift(dynamicTransaction);
      renderFeed();
    }

    function cycleTheme() {
      if (window.parent && window.parent !== window && typeof window.parent.cycleTheme === "function") {
        window.parent.cycleTheme();
      } else {
        location.href = "index_minimal.html";
      }
    }

    /* Initialize */
    window.addEventListener("load", () => {
      bindAcademicData();
      renderFeed();

      if (location.protocol !== "file:") {
        fetch("chi2060_papers.json")
          .then(res => {
            if (!res.ok) throw new Error("Network response was not OK");
            return res.json();
          })
          .then(data => {
            CHI2060_PAPERS = data;
            renderFeed();
          })
          .catch(err => {
            console.error("Background fetch failed, using preloaded:", err);
          });
      }
      localStorage.setItem("chi2060-theme", "dump");
    });
  </script>
</body>
</html>
