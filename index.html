<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ACM CHI 2060</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      margin: 0;
      padding: 0;
    }
  </style>
  <script>
    const themes = ["grid", "classic", "dump"];
    let currentTheme = "";

    function loadTheme(themeName) {
      currentTheme = themeName;
      localStorage.setItem("chi2060-theme", themeName);
      document.getElementById("theme-frame").src = "index_" + themeName + ".html";
    }

    function cycleTheme() {
      const idx = themes.indexOf(currentTheme);
      const nextIdx = (idx + 1) % themes.length;
      loadTheme(themes[nextIdx]);
    }

    window.addEventListener("DOMContentLoaded", () => {
      const lastThemeId = localStorage.getItem("chi2060-theme");
      let filteredThemes = themes;
      
      if (lastThemeId && themes.length > 1) {
        filteredThemes = themes.filter(t => t !== lastThemeId);
      }
      
      const randomTheme = filteredThemes[Math.floor(Math.random() * filteredThemes.length)];
      loadTheme(randomTheme);
    });
  </script>
</head>
<body>
  <iframe id="theme-frame" src=""></iframe>
</body>
</html>
